name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # Same signing key on every build => Android installs each new APK as an UPDATE (no uninstall needed).
      - name: Use the fixed signing key
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            echo "::error title=Signing key missing::keystore/debug.keystore is not in the repository. Upload the project again with the keystore folder included."
            exit 1
          fi
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore keystore/debug.keystore -storepass android | grep -E "SHA1|SHA-1" | sed 's/^/Expected /'

      - name: Build web app
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_GH_REPO: ${{ github.repository }}
          VITE_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screens
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Prepare Android project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 scripts/patch-android.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Margins.apk

      # The fingerprint Google compares with the Android OAuth client (Google sign-in fails when they differ).
      - name: Show APK signing fingerprint
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs out/Margins.apk | grep -E "SHA-1|SHA-256" | tee fp.txt
          echo "### APK signing fingerprint" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' fp.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Package: $(grep -o 'appId[^,]*' capacitor.config.json)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Margins-apk
          path: out/Margins.apk

      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/Margins.apk \
            --title "Margins (latest build)" \
            --notes "build:${{ github.run_number }} — commit ${GITHUB_SHA::7}. Download Margins.apk and install it on your Android phone." \
            --target "$GITHUB_SHA"
