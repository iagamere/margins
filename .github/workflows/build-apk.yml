name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screens
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Prepare Android project
        run: python3 scripts/patch-android.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Margins.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Margins-apk
          path: out/Margins.apk

      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/Margins.apk \
            --title "Margins (latest build)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Download Margins.apk and install it on your Android phone." \
            --target "$GITHUB_SHA"
