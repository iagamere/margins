<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <title>Margins</title>
    <script>
      // Apply theme + language before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('margins.settings') || '{}');
          var lang = ['ar', 'fr', 'en'].indexOf(s.lang) >= 0 ? s.lang : (navigator.language || 'en').slice(0, 2);
          if (['ar', 'fr', 'en'].indexOf(lang) < 0) lang = 'en';
          var theme = s.theme || 'system';
          if (theme === 'system') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var r = document.documentElement;
          r.lang = lang;
          r.dir = lang === 'ar' ? 'rtl' : 'ltr';
          r.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
